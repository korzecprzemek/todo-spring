<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f3f3f3; }
    </style>
</head>
<body>
    <h1>These are Your tasks for today!</h1>
    <form method="get" action="/">
        <div>
            <label for="search">Search:</label>
            <input type="text" id="search" name="search"
                   th:value="${param.search}">
        </div>

        <div>
            <label for="done">Status:</label>
            <select id="done" name="done">
                <option value="">All</option>
                <option value="true" th:selected="${param.done == 'true'}">Done</option>
                <option value="false" th:selected="${param.done == 'false'}">Not done</option>
            </select>
        </div>

        <div>
            <label for="priority">Priority:</label>
            <select id="priority" name="priority">
                <option value="">All</option>
                <option value="LOW" th:selected="${param.priority == 'LOW'}">Low</option>
                <option value="MEDIUM" th:selected="${param.priority == 'MEDIUM'}">Medium</option>
                <option value="HIGH" th:selected="${param.priority == 'HIGH'}">High</option>
            </select>
        </div>

        <button type="submit">Filter</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Task</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Created at</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="t,stat : ${tasks}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${t.taskName}">Task name</td>
            <td th:text="${t.priority}">Task Priority</td>
            <td th:text="${t.done}">Status</td>
            <td th:text="${#temporals.format(t.createdAt,'dd-MM-yyyy HH:mm')}">Created at</td>

            <td>
                <form th:action="@{/tasks/remove}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${t.id}">
                    <button type="submit">Done!</button>
                </form>
            </td>
            <td>
                <form th:action="@{/tasks/toggle}" method="post">
                    <input type="hidden" name="id" th:value="${t.id}">
                    <button type="submit">Toggle Done</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tasks)}">
            <td colspan="3">No Tasks!</td>
        </tr>
        </tbody>
    </table>
        <form method="post" action = "/tasks/find">
            <input name="id" placeholder="Integer"/>
            <button type="submit">Find</button>
        </form>
        <form th:action="@{/tasks/add}" th:object="${taskForm}"method="post">
            <input th:field="*{taskName}" placeholder="What's your task?"/>
            <select th:field="*{priority}">
                <option value="">--Choose your priority!<--</option>
                <option th:each="p : ${T(pl.pkorzec.todo.domain.Priority).values()}"
                        th:value="${p}"
                        th:text="${p}">

                </option>
            </select>
            <button type="submit">Add</button>
        </form>


        <form method="post" action = "/tasks/read">
            <button type="submit">Read your tasks from the CSV!</button>
        </form>
</body>
</html>
